name: pad8pro-kernel

# 只在手动触发时构建：内核是上游 BigfootACA/linux 的固定 commit，
# 我们的仓库里没有内核代码，push 触发没有意义。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "内核 ref：分支名或 commit SHA（建议填 SHA，作者会 rebase/force-push）"
        required: false
        default: "469998695964bc26493861cd11f8c17aa764f2e5"
      config_only:
        description: "只跑到配置阶段并输出驱动审计报告（约 3 分钟，不编译）"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  # 固定 group：同一时间只允许一个构建，手动重复触发会取消前一个，
  # 避免并行白烧 Actions 配额（4 核 runner 一次约 2.5 小时）。
  group: pad8pro-kernel
  cancel-in-progress: true

env:
  KERNEL_REPO: BigfootACA/linux
  KERNEL_REF: ${{ inputs.ref }}
  CROSS_COMPILE: aarch64-linux-gnu-
  # 注意：不能在这里设 CC/HOSTCC。GNU make 中环境变量优先级低于 Makefile 里的
  # `CC = $(CROSS_COMPILE)gcc`，会被静默覆盖，ccache 依然不生效。
  # 正确做法见下面的「配置 ccache 编译器 wrapper」步骤。

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # config_only 模式靠各编译步骤上的 `if: inputs.config_only != 'true'`
    # 跳过编译，保留 checkout / 配置 / 编 dtb / 驱动审计这几步，
    # 约 5 分钟即可拿到权威报告（曾经在这里加过 job 级 if，方向写反导致
    # config_only 时整个 job 被 skipped，已移除）。
    steps:
      # Linux 7.1 + sm8750 带全模块要 20GB+，runner 只有约 15GB。
      # 6pro 的 CI 不需要这步，他的 sm8450 内核小得多。
      - name: 释放 runner 磁盘空间
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift
          echo "=== 清理后 ==="
          df -h /

      # 【必须先检出本仓库】configs/ 和 tools/ 都属于本仓库，不属于内核仓库。
      # 之前只做了下面那个「检出内核源码」（path: linux），$GITHUB_WORKSPACE 里
      # 根本没有 configs/，于是「补齐 Pad 8 Pro 必需驱动」一步直接
      # 报「缺少配置片段 …/configs/pad8pro-required.config」而失败。
      # 内核源码必须放到子目录 linux/，否则会和本仓库的工作区冲突。
      - name: 检出本仓库（configs / tools）
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_REF }}
          path: linux
          persist-credentials: false
          # 只取该 commit 的树，不拉 5.9GB 历史。
          # universal_defconfig 没有 LOCALVERSION_AUTO，编译不依赖 git 描述。
          fetch-depth: 1

      - name: 记录内核版本
        id: kernel
        working-directory: linux
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libgmp-dev \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu \
            python3 ccache kmod rsync zstd device-tree-compiler

      # ccache 必须真正接管编译器，否则缓存里一个对象都不会有。
      # 用 PATH wrapper 而不是 env CC：kbuild 的子 make 也会走同一个 wrapper，
      # 且不会被 Makefile 里的 `CC = $(CROSS_COMPILE)gcc` 覆盖。
      #
      # 两个必须做对的地方：
      #  1. wrapper 内必须用编译器【绝对路径】。wrapper 本身叫 aarch64-linux-gnu-gcc
      #     且置于 PATH 最前，若内部按名字查找会再次命中自己 → 无限 fork 递归。
      #  2. 必须在本 step 内 export PATH。$GITHUB_PATH 只对【后续】step 生效，
      #     只写 $GITHUB_PATH 的话自检会走真实编译器，ccache 一次都没被调用。
      - name: 配置 ccache 编译器 wrapper
        run: |
          set -euo pipefail
          # 在 wrapper 还没进 PATH 之前解析出真实编译器路径
          REAL_CC=$(command -v aarch64-linux-gnu-gcc)
          echo "真实编译器: $REAL_CC"
          mkdir -p "$HOME/ccache-wrapper"
          cat > "$HOME/ccache-wrapper/aarch64-linux-gnu-gcc" <<EOF
          #!/bin/sh
          exec ccache $REAL_CC "\$@"
          EOF
          chmod +x "$HOME/ccache-wrapper/aarch64-linux-gnu-gcc"
          cat "$HOME/ccache-wrapper/aarch64-linux-gnu-gcc"
          # 当前 step 立即生效 + 后续 step 生效
          export PATH="$HOME/ccache-wrapper:$PATH"
          echo "$HOME/ccache-wrapper" >> "$GITHUB_PATH"

          # 压缩：ccache 4.10 起改用配置文件项，4.9 及以前用环境变量。
          # 两种方式都尝试，失败不致命（压缩只是优化，不影响命中率）。
          ccache --set-config=compression=true 2>/dev/null \
            && echo "ccache: 已用 --set-config 开启压缩" \
            || ccache --compress 2>/dev/null \
            && echo "ccache: 已用 --compress 开启压缩" \
            || echo "ccache: 压缩不可用（非致命）"

          # 自检：编译两次。timeout 保证递归卡死时 60 秒内失败而不是挂住整个 job。
          printf 'int probe(void){return 0;}\n' > /tmp/probe.c
          timeout 60 aarch64-linux-gnu-gcc -c /tmp/probe.c -o /tmp/probe1.o
          timeout 60 aarch64-linux-gnu-gcc -c /tmp/probe.c -o /tmp/probe2.o
          echo "=== ccache 自检统计（应看到 Hits >= 1）==="
          ccache -s | tee /tmp/ccache-selftest.txt
          grep -qE 'Hits:[[:space:]]+[1-9]' /tmp/ccache-selftest.txt \
            || { echo "::error::wrapper 自检失败：第二次编译未命中 ccache"; exit 1; }

      # key 用内核自身 SHA：同一内核版本反复构建能命中缓存，
      # 内核换 commit 时自动失效。
      - name: 恢复 ccache 缓存
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: pad8pro-ccache-${{ runner.os }}-${{ steps.kernel.outputs.sha }}
          restore-keys: pad8pro-ccache-${{ runner.os }}-
          max-size: 5GB

      - name: 校验输入
        run: |
          set -euo pipefail
          if [ -z "$KERNEL_REF" ]; then
            echo "::error::必须填写内核 ref（分支名或 commit SHA）"
            exit 1
          fi
          echo "内核 ref: $KERNEL_REF"

      - name: 配置内核
        working-directory: linux
        env:
          CCACHE_MAXSIZE: 5G
        run: |
          set -euo pipefail
          make ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} O=out universal_defconfig
          grep -q 'sm8750-xiaomi-piano.dtb' arch/arm64/boot/dts/qcom/Makefile \
            || { echo "::error::piano dtb 未在 dts/qcom/Makefile 注册"; exit 1; }
          grep -E '^CONFIG_(ARCH_QCOM|MODULES|PREEMPT)=' out/.config

      # universal_defconfig 采用 allnoconfig 语义：没写到的选项 = n。
      # 它漏掉了 Pad 8 Pro 的显示/键盘/充电驱动，必须补齐，否则黑屏。
      - name: 补齐 Pad 8 Pro 必需驱动
        working-directory: linux
        run: |
          set -euo pipefail
          FRAG="$GITHUB_WORKSPACE/configs/pad8pro-required.config"
          test -f "$FRAG" || { echo "::error::缺少配置片段 $FRAG"; exit 1; }
          echo "=== 追加片段 ==="
          cat "$FRAG"
          # 先补一个换行：若 .config 末尾没有换行符，直接 >> 会把第一行
          # 拼到上一行末尾，olddefconfig 会静默忽略整个片段。
          printf '\n' >> out/.config
          cat "$FRAG" >> out/.config
          make ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} O=out olddefconfig

          # 失败时最容易缺的就是这一段：同时打印目标符号与其关键依赖，
          # 一眼看出是「符号不存在」还是「依赖没满足被 kbuild 降到 n」。
          echo "=== olddefconfig 后的实际取值 ==="
          grep -E '^(CONFIG_DRM_PANEL_NOVATEK_NT36532|CONFIG_HID_NANOSIC|CONFIG_CHARGER_SC8541|CONFIG_CHARGER_SC96231|CONFIG_DRM_MIPI_DSI|CONFIG_BACKLIGHT_CLASS_DEVICE|CONFIG_I2C|CONFIG_DRM_MSM)=' out/.config \
            || echo "（以上符号一个都没出现）"

          echo
          echo "=== 片段生效情况 ==="
          # 片段里每行形如「CONFIG_FOO=m」，必须只取 = 左边的符号名去查 .config。
          # 之前直接拿整行当符号，拼出的模式是 ^CONFIG_FOO=m=[ym]，永远匹配不上，
          # 于是四个驱动全被误报成「未生效」，NT36532 的硬失败断言必然触发。
          missing=""
          while read -r line; do
            case "$line" in \#*|'') continue ;; esac
            sym=${line%%=*}
            if grep -q "^$sym=[ym]" out/.config; then
              printf '  OK   %s=%s\n' "$sym" "$(grep -m1 "^$sym=" out/.config | cut -d= -f2)"
            else
              printf '  WARN %s 未生效（Kconfig 无此符号或依赖不满足）\n' "$sym"
              missing="$missing $sym"
            fi
          done < "$FRAG"

          # 显示驱动缺失 = 刷机必然黑屏，必须硬失败。
          case "$missing" in
            *CONFIG_DRM_PANEL_NOVATEK_NT36532*)
              echo "::error::面板驱动 NT36532 未能启用，构建无意义"
              exit 1 ;;
          esac

      # 设备树编译很快（不需要编译内核），且审计步骤依赖 dtb，
      # 所以 config_only 模式也要跑这一步。
      - name: 编译设备树
        working-directory: linux
        run: |
          set -euo pipefail
          make ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} O=out \
            -j"$(nproc)" dtbs 2>&1 | tee build-dtbs.log
          DTB=out/arch/arm64/boot/dts/qcom/sm8750-xiaomi-piano.dtb
          test -f "$DTB" || { echo "::error::sm8750-xiaomi-piano.dtb 未生成"; exit 1; }
          # 反序列化确认确实是这台机器的设备树，防止上游同名文件被改坏
          dtc -I dtb -O dts "$DTB" > /tmp/piano.dts
          grep -q 'xiaomi,piano' /tmp/piano.dts \
            || { echo "::error::dtb 里没有 compatible = xiaomi,piano"; exit 1; }
          grep -q 'novatek,nt36532' /tmp/piano.dts \
            || { echo "::error::dtb 里没有面板 compatible novatek,nt36532"; exit 1; }
          ls -lh "$DTB"

      # 用编译出的 dtb 反查内核源码：哪些 compatible 找不到任何驱动。
      # 这是权威答案，不靠猜 Kconfig 名。
      - name: 审计 dtb 中每个器件的内核驱动
        working-directory: linux
        run: |
          set -euo pipefail
          {
            echo "## dtb 驱动审计"
            echo ""
            echo '```'
            python3 "$GITHUB_WORKSPACE/tools/audit-dt-drivers.py" \
              /tmp/piano.dts . out/.config || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # config_only 模式到此为止：不进编译，3 分钟拿到报告
      - name: 编译 Image
        if: inputs.config_only != 'true'
        working-directory: linux
        run: |
          set -euo pipefail
          make ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} O=out \
            -j"$(nproc)" Image 2>&1 | tee build-image.log
          test -f out/arch/arm64/boot/Image \
            || { echo "::error::Image 未生成"; exit 1; }
          ls -lh out/arch/arm64/boot/Image

      # 早期断言：Image 阶段编译了上千个 .o，如果 ccache 没真正接管编译器，
      # Cacheable calls 会是 0。这里十几分钟就能发现，不必等两小时。
      - name: 确认 ccache 生效
        if: inputs.config_only != 'true'
        run: |
          set -euo pipefail
          ccache -s | tee /tmp/ccache-stats.txt
          if ! grep -qE 'Cacheable calls:[[:space:]]+[1-9]' /tmp/ccache-stats.txt; then
            echo "::error::ccache 未接管编译器（Cacheable calls 为 0），缓存不会被保存"
            exit 1
          fi
          { echo "## ccache"
            echo '```'
            cat /tmp/ccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编译内核模块
        if: inputs.config_only != 'true'
        working-directory: linux
        run: |
          set -euo pipefail
          make ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} O=out \
            -j"$(nproc)" modules 2>&1 | tee build-modules.log
          # 关键模块必须存在。msm 是模块而非内建，缺了就出不了画面。
          # 注意模块名是 msm.ko 而不是 drm_msm.ko：drivers/gpu/drm/msm/Makefile
          # 写的是 obj-$(CONFIG_DRM_MSM) += msm.o。之前写成 drm_msm.ko，
          # 整个模块编译（3 小时）成功后被这条断言判失败。
          for pat in 'msm.ko' 'ath11k*.ko' 'panel-novatek-nt36532.ko' 'hid-nanosic.ko'; do
            if ! find out -name "$pat" -print -quit | grep -q .; then
              echo "::error::关键模块缺失: $pat"
              echo "  提示：面板/键盘驱动若显示为 WARN，请检查 configs/pad8pro-required.config"
              exit 1
            fi
            echo "  OK  $pat -> $(find out -name "$pat" -printf '%p\n' | head -1)"
          done

      - name: 安装模块到暂存目录
        if: inputs.config_only != 'true'
        run: |
          set -euo pipefail
          KVER=$(make -s -C linux ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out kernelrelease)
          mkdir -p out-root
          # INSTALL_MOD_STRIP=1 去掉 .ko 调试符号：universal_defconfig 有 6848 个模块，
          # 不 strip 时 modules.tar.gz 会到 2.9GB，对刷机没有任何用处。
          # 安全性：已核实 universal_defconfig 未开启 CONFIG_MODULE_SIG。
          make -C linux ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out \
            modules_install INSTALL_MOD_PATH="$PWD/out-root" INSTALL_MOD_STRIP=1
          sudo depmod -b "$PWD/out-root" "$KVER"
          printf '%s\n' "$KVER" > kver.txt

      - name: 诊断模块体积构成
        if: inputs.config_only != 'true'
        run: |
          echo "=== 模块数量 ==="
          find out-root/lib/modules -name '*.ko' | wc -l
          echo "=== strip 后未压缩总量 ==="
          du -sh out-root/lib/modules
          echo "=== 剩余磁盘 ==="
          df -h / | tail -1
          echo "=== drivers 子目录 top 20（判断是否值得裁剪）==="
          du -sh out-root/lib/modules/*/kernel/drivers/*/ 2>/dev/null | sort -rh | head -20
          {
            echo "## 模块构成"
            echo ""
            echo "- 模块数: $(find out-root/lib/modules -name '*.ko' | wc -l)"
            echo "- strip 后未压缩: $(du -sh out-root/lib/modules | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 构建失败时保留 .config 和编译日志尾部，否则只能靠重跑本地复现来定位
      - name: 保留失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pad8pro-config-failure-${{ steps.kernel.outputs.sha }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            linux/out/.config
            linux/build-image.log
            linux/build-modules.log
          retention-days: 7

      - name: 收集内核产物
        if: inputs.config_only != 'true'
        run: |
          set -euo pipefail
          KVER=$(cat kver.txt)
          DST="dist/pad8pro-$KVER"
          mkdir -p "$DST/boot"
          cp linux/out/arch/arm64/boot/Image "$DST/boot/Image"
          cp linux/out/arch/arm64/boot/dts/qcom/sm8750-xiaomi-piano.dtb "$DST/boot/"
          cp linux/out/.config "$DST/config"
          cp linux/out/System.map "$DST/System.map"
          # config 的 sha256 必须记进产物：换 config 后无法区分是哪套配置出的包
          CFG_SHA=$(sha256sum linux/out/.config | cut -d' ' -f1)
          IMG_COMP=$(sed -n 's/^CONFIG_KERNEL_\(ZSTD\|LZ4\|GZIP\)=y/\1/p' linux/out/.config | head -1)
          IMG_SIZE=$(stat -c%s "$DST/boot/Image")
          FRAG_SHA=$(sha256sum "$GITHUB_WORKSPACE/configs/pad8pro-required.config" | cut -d' ' -f1)
          cat > "$DST/build-info.txt" <<EOF
          repo=$KERNEL_REPO
          ref=$KERNEL_REF
          commit=${{ steps.kernel.outputs.sha }}
          kernelrelease=$KVER
          config_sha256=$CFG_SHA
          required_fragment_sha256=$FRAG_SHA
          image_bytes=$IMG_SIZE
          image_compression=${IMG_COMP:-none}
          module_count=$(find out-root/lib/modules -name '*.ko' | wc -l)
          modules_stripped=yes
          EOF
          cat "$DST/build-info.txt"
          { echo "## 构建信息"
            echo ""
            echo '```'
            cat "$DST/build-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 打包内核模块
        if: inputs.config_only != 'true'
        run: |
          set -euo pipefail
          KVER=$(cat kver.txt)
          tar -C out-root --zstd -cf "dist/modules-$KVER.tar.zst" lib/modules
          ls -lh "dist/modules-$KVER.tar.zst"
          # 校验清单放进核心 artifact 内部，否则不会被任何 artifact 收走
          ( cd dist && find . -type f -not -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > "pad8pro-$KVER/SHA256SUMS" )
          echo "=== SHA256SUMS ==="
          cat "dist/pad8pro-$KVER/SHA256SUMS"

      # 核心产物几十 MB，单独一个 artifact，刷机时只需要下载它。
      - name: 上传内核产物
        if: inputs.config_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pad8pro-kernel-${{ steps.kernel.outputs.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: dist/pad8pro-*
          retention-days: 30

      # 模块体积大、下载慢，和核心产物分开，避免每次都要下 2.9G。
      # retention 与核心产物一致：刷机可能失败重试，两份文件的有效期不该错开。
      - name: 上传内核模块
        if: inputs.config_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pad8pro-modules-${{ steps.kernel.outputs.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: dist/modules-*.tar.zst
          retention-days: 30
