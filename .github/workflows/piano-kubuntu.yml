# 草案：liisoya/pad8pro-kernel-build 分支 piano-kubuntu 的工作流
# 参照 blu-sharky/debian-piano .github/workflows/build.yml 改造。
# push 触发已启用（T18/T19 代码落地）；dispatch 留作手动重跑与 inputs 控制。
name: piano-kubuntu

on:
  push:
    branches: [piano-kubuntu]
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'linux-piano revision (default piano-7.2.6)'
        default: piano-7.2.6
        required: true
      firmware_ref:
        description: 'piano-firmware revision'
        default: main
        required: false
      mesa_ref:
        description: 'piano-mesa revision'
        default: main
        required: false
      sensors_ref:
        description: 'piano-sensors revision'
        default: main
        required: false
      mipps_ref:
        description: 'piano-mipps-auth revision'
        default: main
        required: false

permissions:
  contents: read
  actions: write   # prune older ccache entries of this ref

jobs:
  build:
    name: kubuntu-26.04-kde
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 8G
    steps:
      - name: Checkout this branch (modified debian-piano + ci/)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          repository: blu-sharky/linux-piano
          ref: ${{ inputs.kernel_ref || 'piano-7.2.6' }}
          path: workspace/linux-piano
          persist-credentials: false

      - name: Checkout piano firmware
        uses: actions/checkout@v5
        with:
          repository: blu-sharky/piano-firmware
          ref: ${{ inputs.firmware_ref || 'main' }}
          path: workspace/piano-firmware
          persist-credentials: false

      - name: Checkout piano sensors
        uses: actions/checkout@v5
        with:
          repository: blu-sharky/piano-sensors
          ref: ${{ inputs.sensors_ref || 'main' }}
          path: workspace/piano-sensors
          persist-credentials: false

      - name: Checkout piano MiPPS authentication
        uses: actions/checkout@v5
        with:
          repository: blu-sharky/piano-mipps-auth
          ref: ${{ inputs.mipps_ref || 'main' }}
          path: workspace/piano-mipps-auth
          persist-credentials: false

      # Loopback video devices (GPL-2.0) for piano-camerad, built against the
      # image kernel; pinned to the same commit as upstream.
      - name: Checkout v4l2loopback
        uses: actions/checkout@v5
        with:
          repository: umlaeute/v4l2loopback
          ref: 0f9ee86760b7f2bea174b7e3e7a1d38845da0ab4
          path: workspace/v4l2loopback
          persist-credentials: false

      # m4 macro library for the piano AudioReach topology (BSD-3-Clause);
      # pinned for reproducibility (same pin as upstream).
      - name: Checkout AudioReach topology macros
        uses: actions/checkout@v5
        with:
          repository: linux-msm/audioreach-topology
          ref: 993a17dcb672357998a463a73f120064d6c74f4f
          path: workspace/audioreach-topology
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              clang lld llvm ccache make flex bison bc libssl-dev libelf-dev \
              rsync cpio kmod device-tree-compiler debootstrap \
              curl openssh-client openssl \
              e2fsprogs python3 zstd xz-utils lz4 m4
          # The Ubuntu runner already trusts the Ubuntu archive (ubuntu-keyring
          # preinstalled; the Debian-side name ubuntu-archive-keyring does not
          # exist here). Assert the keyring our scripts default to.
          test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
          df -h "$GITHUB_WORKSPACE"
          # The noble runner's debootstrap may predate Ubuntu 26.04: pull a
          # debootstrap that carries the resolute suite script from resolute
          # itself (1.0.142ubuntu2), then remove the temporary source.
          if [ ! -e /usr/share/debootstrap/scripts/resolute ]; then
            echo "deb http://archive.ubuntu.com/ubuntu resolute main" | sudo tee /etc/apt/sources.list.d/resolute-debootstrap.list
            sudo apt-get update
            sudo apt-get install -y debootstrap
            sudo rm /etc/apt/sources.list.d/resolute-debootstrap.list
            test -e /usr/share/debootstrap/scripts/resolute
            debootstrap --version
          fi

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: piano-kde-clang-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            piano-kde-clang-${{ runner.os }}-${{ runner.arch }}-

      - name: Inject dual-boot cmdline into piano_rootfs.config
        working-directory: workspace/linux-piano
        run: |
          # cmdline sits inside CONFIG_CMDLINE="..." and the release suffix in
          # CONFIG_LOCALVERSION — substring replaces, verified against the
          # actual fragment (lines CONFIG_CMDLINE / CONFIG_LOCALVERSION).
          cfg=arch/arm64/configs/piano_rootfs.config
          test -f "$cfg"
          sed -i 's/root=PARTLABEL=userdata/root=PARTLABEL=linux-root/; s/CONFIG_LOCALVERSION="-piano-gnome"/CONFIG_LOCALVERSION="-piano-kde"/' "$cfg"
          grep -n 'root=PARTLABEL=\|CONFIG_LOCALVERSION' "$cfg"
          grep -q 'root=PARTLABEL=linux-root' "$cfg" || { echo 'cmdline injection failed' >&2; exit 1; }
          git diff > "$GITHUB_WORKSPACE/piano_rootfs.config.diff"
          echo "cmdline-diff-sha256 $(sha256sum "$GITHUB_WORKSPACE/piano_rootfs.config.diff" | cut -d' ' -f1)"

      # 配套组件（必建，序列照抄上游 run 37808998629）：mesa 与内核共享 ccache。
      # mesa 用本分支 vendored 的 resolute 变体（kisak 源 + A830v1 补丁），
      # 不是 blu-sharky/piano-mesa 的 Debian trixie 构建（其 deb 依赖
      # libllvm19/libdisplay-info2，resolute 不可安装——run 37896432396 实证）。
      - name: Build piano Mesa
        working-directory: ${{ github.workspace }}
        run: |
          piano-mesa/scripts/build-in-container.sh out/mesa "$CCACHE_DIR"
          echo "piano-mesa resolute-variant (vendored; kisak source 26.2.4~kisak1~r + 2061a5ee)" > out/mesa/SOURCE

      - name: Build piano sensors packages
        working-directory: workspace
        run: |
          piano-sensors/scripts/build-in-container.sh ../out/sensors
          echo "piano-sensors $(git -C piano-sensors rev-parse HEAD)" > ../out/sensors/SOURCE

      - name: Build piano MiPPS authentication package
        working-directory: workspace
        run: |
          mkdir -p ../out/userspace
          cp ../out/sensors/runtime/*.deb ../out/userspace/
          piano-mipps-auth/build-deb.sh "$GITHUB_WORKSPACE/out/userspace/xiaomi-mipps-auth.deb"
          echo "piano-mipps-auth $(git -C piano-mipps-auth rev-parse HEAD)" > ../out/userspace/SOURCE

      # 一体编排：内核 Image/dtbs/modules -> Kubuntu rootfs -> 镜像/boot/dtbo -> gates
      # 脚本内部职责见 Bulid/github-actions-build-plan.md §3；gate 全过才出包。
      - name: Build kernel + Kubuntu rootfs + images
        working-directory: ${{ github.workspace }}
        env:
          SSH_PUBLIC_KEY: ${{ vars.PIANO_SSH_PUBLIC_KEY }}
        run: |
          ccache --zero-stats
          mkdir -p out
          key_args=()
          if [ -n "$SSH_PUBLIC_KEY" ]; then
            printf '%s\n' "$SSH_PUBLIC_KEY" > out/authorized_keys
            key_args=(--authorized-keys "$PWD/out/authorized_keys")
          fi
          # bash -x: full trace until the pipeline is green (diagnosis aid)
          bash -x ci/build-kubuntu.sh \
              --kernel-tree workspace/linux-piano \
              --firmware-tree workspace/piano-firmware/firmware \
              --mesa-dir out/mesa/runtime \
              --sensors-dir out/userspace \
              --v4l2loopback workspace/v4l2loopback \
              --audioreach-topology workspace/audioreach-topology \
              --jobs "$(nproc)" \
              --output out/image \
              "${key_args[@]}"

      - name: Package flashable bundle and rootfs tarball
        working-directory: ${{ github.workspace }}
        run: |
          # RAM boot 不需要 AVB footer；落盘冷启动到 boot_b 需要（方案 §3 第 7 步）
          # 双系统路线不发货 userdata.img（若有产物，删除以免误刷）
          rm -f out/image/userdata.raw.img out/image/userdata.img
          debian-piano/scripts/sign-boot-avb.sh out/image/boot.img
          echo "boot.img: AVB-signed after build; flashed sha256 $(sha256sum out/image/boot.img | cut -d' ' -f1)" >> out/image/MANIFEST.txt
          cat piano_rootfs.config.diff >> out/image/MANIFEST.txt
          mkdir -p out/bundle out/rootfs-tar
          cp out/image/boot.img out/image/dtbo.img out/image/kernel.config \
              out/image/packages.txt out/image/MANIFEST.txt \
              out/image/SOURCE-SHA256SUMS out/bundle/
          (cd out/bundle && sha256sum ./* > SHA256SUMS)
          sudo tar --numeric-owner --xattrs --acls -C out/image/rootfs \
              -I 'zstd -T0 -3' -cf out/rootfs-tar/rootfs-kubuntu-26.04-arm64.tar.zst .
          (cd out/rootfs-tar && sha256sum ./* > SHA256SUMS)
          du -sh out/bundle/* out/rootfs-tar/*

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      # 每 ref 只留一条缓存（照抄上游纪律，防止挤爆 10 GiB 配额）
      - name: Prune this ref's older compiler caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --key piano-kde-clang- --limit 100 --json id --jq '.[].id' |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: piano-kde-clang-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload flashable boot/dtbo bundle
        uses: actions/upload-artifact@v4
        with:
          name: piano-kde-flash-${{ github.sha }}
          path: out/bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload rootfs tarball
        uses: actions/upload-artifact@v4
        with:
          name: piano-kde-rootfs-${{ github.sha }}
          path: out/rootfs-tar/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload ephemeral access key
        if: ${{ vars.PIANO_SSH_PUBLIC_KEY == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: piano-access-key-${{ github.sha }}
          path: out/image/access-key*
          if-no-files-found: error
          retention-days: 30
